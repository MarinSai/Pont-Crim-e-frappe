<!DOCTYPE html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{titre}}</title>
<style>
  /* Polices du Grand Continent, sous-ensemble latin, intégrées au fichier. */
  /*FONTS*/
  :root{
    /* Bloc graphique pour iframe : titre, clé, scène animée, étapes, légende, source.
       Tout est aligné à gauche, sans cadre. Thème clair uniquement. */
    --papier:#ffffff;
    --encre:#141414;
    --gris:#6e6e73;
    --filet:#dcdcdc;
    --rouge:#dd203c;   /* impacts, section détruite */
    --bleu:#1f4aa8;    /* drones et missiles ukrainiens */
    --titre:"Sanomat","Sanomat Web","Playfair Display",Georgia,"Times New Roman",serif;
    --texte:"National","National Web","Libre Franklin","Helvetica Neue",Arial,sans-serif;
    --marge:20px;
    color-scheme:light;
  }
  html.embarque{--marge:0px}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--papier);color:var(--encre);font-family:var(--texte);-webkit-text-size-adjust:100%}
  body{overflow-x:hidden}

  .bloc{max-width:1040px;margin:0 auto;padding:6px var(--marge) 10px;display:flex;flex-direction:column;gap:14px}

  .tete{display:flex;flex-direction:column;gap:6px}
  h1{font-family:var(--titre);font-weight:700;font-size:clamp(21px,3.3vw,28px);line-height:1.16;text-wrap:balance}
  .chapo{font-size:15px;line-height:1.4;color:var(--gris)}

  .cle{list-style:none;display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12.5px;line-height:1.3;color:#3b3b40}
  .cle li{display:flex;align-items:center;gap:6px;white-space:nowrap}
  .cle svg{flex:none;display:block}

  .scene{position:relative;line-height:0}
  canvas{display:block;width:100%}

  .pilotage{display:flex;align-items:center;gap:12px}
  .lecture{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--encre);background:var(--papier);color:var(--encre);
           display:grid;place-items:center;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .lecture:hover{background:var(--encre);color:var(--papier)}
  .lecture svg{display:none}
  .lecture[data-etat="lecture"] .ico-pause{display:block}
  .lecture[data-etat="pause"] .ico-lecture{display:block}
  .lecture[data-etat="fin"] .ico-rejouer{display:block}

  .etapes{flex:1;min-width:0;list-style:none;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
  .etapes button{display:flex;align-items:center;width:100%;min-height:44px;padding:0;border:0;background:none;font:inherit;
                 cursor:pointer;-webkit-tap-highlight-color:transparent}
  .jauge{display:block;flex:1;height:3px;background:var(--filet);overflow:hidden}
  .etapes button:hover .jauge{background:#c4c4c8}
  .jauge i{display:block;height:100%;width:0;background:var(--rouge)}

  button:focus-visible{outline:2px solid var(--bleu);outline-offset:3px}


  .source{font-size:12px;line-height:1.45;color:var(--gris);border-top:1px solid var(--filet);padding-top:10px}

  @media (max-width:560px){
    .bloc{gap:12px}
    .chapo{font-size:14px}
    .cle{gap:5px 14px;font-size:12px}
    .pilotage{gap:10px}
    .etapes{gap:4px}
  }
  @media (max-width:400px){
    :root{--marge:16px}
    html.embarque{--marge:0px}
  }
</style>
<script>
  /* Bloc iFrame du Grand Continent (iframe-resizer) : quand la page parente répond,
     on retire la marge latérale pour s'aligner sur la colonne de l'article. */
  window.iFrameResizer = { onReady: function(){ document.documentElement.classList.add('embarque'); } };
</script>
<script src="https://cdn.jsdelivr.net/npm/@iframe-resizer/child@5.5.9/index.umd.js" async></script>
</head>
<body>
<main class="bloc">

  <header class="tete">
    <h1>{{titre}}</h1>
    <p class="chapo">{{chapo}}</p>
  </header>

  <ul class="cle" aria-label="Clé de lecture">
    <li><svg width="16" height="12" viewBox="0 0 16 12" aria-hidden="true"><path d="M15 6 L2 1 L5 6 L2 11 Z" fill="#1f4aa8" stroke="#1f4aa8" stroke-width="1.4" stroke-linejoin="round"/></svg>{{cle0}}</li>
    <li><svg width="16" height="12" viewBox="0 0 16 12" aria-hidden="true"><path d="M15 6 L2 1 L5 6 L2 11 Z" fill="#fff" stroke="#1f4aa8" stroke-width="1.4" stroke-linejoin="round"/></svg>{{cle1}}</li>
    <li><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="6" fill="rgba(221,32,60,.1)" stroke="#dd203c" stroke-width="1.2"/><circle cx="7" cy="7" r="2.2" fill="#dd203c"/></svg>{{cle2}}</li>
    <li><svg width="22" height="12" viewBox="0 0 22 12" aria-hidden="true"><path d="M2 11 A14 14 0 0 1 20 11" fill="none" stroke="#141414" stroke-width="1.6" stroke-dasharray="4 3"/></svg>{{cle3}}</li>
    <li><svg width="22" height="12" viewBox="0 0 22 12" aria-hidden="true"><rect x="1" y="1.5" width="20" height="9" fill="rgba(221,32,60,.08)"/><path d="M1 10.5 L10 1.5 M6 10.5 L15 1.5 M11 10.5 L20 1.5 M16 10.5 L21 5.5 M1 5.5 L5 1.5" stroke="#dd203c" stroke-opacity=".45" stroke-width=".9"/><path d="M1 1.5 H21" stroke="#dd203c" stroke-opacity=".8" stroke-width="1.2"/></svg>{{cle4}}</li>
    <li><svg width="22" height="12" viewBox="0 0 22 12" aria-hidden="true"><rect x="1" y="2" width="20" height="8" fill="rgba(221,32,60,.1)" stroke="#dd203c" stroke-width="1.2" stroke-dasharray="3 2"/></svg>{{cle5}}</li>
  </ul>

  <div class="scene" id="scene">
    <canvas id="c" role="img" aria-label="{{aria}}"></canvas>
  </div>

  <div class="pilotage">
    <button class="lecture" id="lecture" type="button" data-etat="pause" aria-label="{{lire}}">
      <svg class="ico-pause" width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><rect x="2" y="1" width="3.6" height="12" fill="currentColor"/><rect x="8.4" y="1" width="3.6" height="12" fill="currentColor"/></svg>
      <svg class="ico-lecture" width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 1 L13 7 L3 13 Z" fill="currentColor"/></svg>
      <svg class="ico-rejouer" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.2 8 A5.2 5.2 0 1 1 11.3 4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M9.2 1.2 L12.6 4.3 L8.6 5.9 Z" fill="currentColor"/></svg>
    </button>
    <ol class="etapes">
      <li><button type="button" data-i="0" aria-label="{{etape0}}"><span class="jauge"><i></i></span></button></li>
      <li><button type="button" data-i="1" aria-label="{{etape1}}"><span class="jauge"><i></i></span></button></li>
      <li><button type="button" data-i="2" aria-label="{{etape2}}"><span class="jauge"><i></i></span></button></li>
      <li><button type="button" data-i="3" aria-label="{{etape3}}"><span class="jauge"><i></i></span></button></li>
    </ol>
  </div>

  <p class="source">{{note}}<br>{{source}}</p>

</main>

<script>
const DATA = __DATA__;
const TX = __TX__;
/*SCRIPT*/
</script>
</body>
</html>
